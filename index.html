<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olea Coffee & Kitchen — Menu</title>
<meta name="description" content="Scan, choose and order from your table. Olea Coffee & Kitchen digital menu.">
<meta name="theme-color" content="#2B2118">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=1">
</head>
<body>
<a class="skip" href="#menu">Skip to menu</a>

<header class="hdr" id="hdr">
  <a class="brand" href="#top" aria-label="Olea">
    <span class="mark" id="markHdr"></span>
    <span class="brand-t"><b>Olea</b><small data-t="ui.tagline"></small></span>
  </a>
  <div class="hdr-act">
    <button class="tbl-pill" id="tblPill" type="button"></button>
    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="lang-menu" id="langMenu" role="menu"></div>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="hero-bg"><img src="assets/img/hero.jpg" alt="" fetchpriority="high"></div>
    <div class="hero-shade"></div>
    <div class="hero-in">
      <p class="hero-greet"><span class="steam" aria-hidden="true"><i></i><i></i><i></i></span><span id="greet"></span></p>
      <h1 id="welcome"></h1>
      <p class="hero-meta"><span class="open-dot" id="openState"></span><span id="hoursTxt"></span></p>
      <button class="seat" id="seat" type="button"></button>
      <div class="quick" id="quick"></div>
    </div>
  </section>

  <div class="tools" id="menu">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button class="search-x" id="qx" type="button" aria-label="Clear">×</button>
    </label>
    <div class="filters" id="filters"></div>
  </div>
  <nav class="cats" id="cats" aria-label="Categories"><div class="cats-in" id="catsIn"></div></nav>

  <section class="favs" id="favs"></section>
  <div class="sections" id="sections"></div>
  <p class="nores" id="nores" hidden></p>

  <section class="about" id="about"></section>
</main>

<footer class="ftr" id="ftr"></footer>

<!-- floating -->
<button class="ai-fab" id="aiFab" type="button"></button>
<button class="cartbar" id="cartbar" type="button" hidden></button>
<aside class="try" id="try" hidden></aside>

<!-- sheets -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="sheet-x" id="sheetX" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/data.js?v=1"></script>
<script src="assets/qr.js?v=1"></script>
<script src="assets/lang/en.js?v=1"></script>
<script src="assets/lang/tr.js?v=1"></script>
<script src="assets/lang/fr.js?v=1"></script>
<script src="assets/lang/de.js?v=1"></script>
<script src="assets/lang/ar.js?v=1"></script>
<script src="assets/app.js?v=1"></script>
</body>
</html>
